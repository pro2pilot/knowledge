<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">.knowledge trust flow</title>
  <desc id="desc">Agent requests, code and tests, and advisory memory pass through the .knowledge trust layer. Trusted context and PR review continue forward; stale or conflicting knowledge is repaired and checked again.</desc>
  <defs>
    <style>
      .ink{fill:#0f172a}
      .muted{fill:#64748b}
      .blue{fill:#2563eb}
      .green{fill:#15803d}
      .amber{fill:#b45309}
      .line{fill:none;stroke:#cbd5e1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .line-blue{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .line-green{fill:none;stroke:#15803d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .line-amber{fill:none;stroke:#b45309;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:10 12}
      .h1{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:44px;font-weight:750;letter-spacing:-1px}
      .h2{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:26px;font-weight:700}
      .body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;font-weight:520}
      .small{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;font-weight:520}
      .caps{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:750;letter-spacing:1.5px}
    </style>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
  </defs>

  <rect width="1500" height="650" fill="#fff"/>

  <!-- Sources -->
  <g transform="translate(90 130)">
    <circle cx="26" cy="26" r="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <path d="M18 22h16M18 30h10" class="line-blue" stroke-width="2.2"/>
    <text x="65" y="24" class="h2 ink">Agent request</text>
    

    <circle cx="26" cy="170" r="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <path d="M15 170l8 8 16-18" class="line-green" stroke-width="3"/>
    <text x="65" y="168" class="h2 ink">Code + tests</text>
    <text x="65" y="194" class="small green">source of truth</text>

    <circle cx="26" cy="314" r="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <path d="M14 310c5-10 19-10 24 0M14 318c5 10 19 10 24 0" class="line-amber" stroke-width="2.1"/>
    <text x="65" y="312" class="h2 ink">External memory</text>
    <text x="65" y="338" class="small amber">advisory only</text>
  </g>

  <!-- Input lines -->
  <path d="M360 156 H500 Q540 156 578 212" class="line-blue"/>
  <path d="M360 300 H570" class="line-green"/>
  <path d="M360 444 H500 Q540 444 578 388" class="line-amber dash"/>

  <!-- Trust gate -->
  <g>
    <path d="M610 112V488" class="line" stroke="#334155"/>
    <path d="M870 112V488" class="line" stroke="#334155"/>
    <path d="M610 112H870" class="line" stroke="#334155"/>
    <path d="M610 488H870" class="line" stroke="#334155"/>

    <text x="740" y="220" text-anchor="middle" class="h1 ink">.knowledge</text>
    <text x="740" y="253" text-anchor="middle" class="body muted">trust layer</text>

    <line x1="655" y1="314" x2="825" y2="314" class="line-blue" marker-end="url(#arrBlue)"/>
    <text x="740" y="355" text-anchor="middle" class="small ink">Route · Evidence · Freshness</text>
  </g>

  <!-- Trusted output -->
  <path d="M870 235H1080" class="line-green" marker-end="url(#arrGreen)"/>
  <circle cx="1140" cy="235" r="25" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <path d="M1129 235l8 8 16-18" class="line-green" stroke-width="3"/>
  <text x="1190" y="226" class="caps green">TRUSTED</text>
  <text x="1190" y="257" class="h2 ink">Context + PR review</text>
  

  <!-- Repair output -->
  <path d="M870 382H1080" class="line-amber" marker-end="url(#arrAmber)"/>
  <circle cx="1140" cy="382" r="25" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <path d="M1140 369v15M1140 391v1" class="line-amber" stroke-width="3"/>
  <text x="1190" y="373" class="caps amber">REPAIR</text>
  <text x="1190" y="404" class="h2 ink">Needs recheck</text>
  <text x="1190" y="431" class="small muted">stale · missing · conflict</text>

  <!-- Repair loop -->
  <path d="M1140 410 C1136 526 980 565 772 565 C640 565 585 522 585 455" class="line-amber" marker-end="url(#arrAmber)"/>
  <text x="835" y="604" text-anchor="middle" class="body amber">repair → verify again</text>

</svg>
