title: "[Field report] "
body:
  - type: markdown
    attributes:
      value: |
        # Field Report: Testing Pro2Pilot .knowledge

        This report describes hands-on experience with Pro2Pilot .knowledge.

        The goal is to record what was tested, what proved useful, what did not work, and whether adding this extra layer to a repository was worth it.

        **Starting with `.knowledge` 3.2.12**, you can prepare this report semi-automatically with the `field-report` command. It gathers available repository metrics, asks follow-up questions, and creates a draft for you to review before posting.

        **Only include things you actually observed. A formal benchmark is not required.** Optional fields may be left blank. One concrete example with evidence is more useful than a complete but vague report.

        Do not publish secrets, credentials, private source code, personal data, or internal addresses.

        Complete the title as: `[Field report] <project or stack> + <agent> — <main result>`.

  - type: input
    id: knowledge-version
    attributes:
      label: ".knowledge version"
      description: "Enter the release version or commit SHA used during the test."
      placeholder: "Example: 3.2.12"
    validations:
      required: true

  - type: textarea
    id: project-context
    attributes:
      label: "Project context"
      description: "Briefly describe your role, the repository (public link or anonymized description), project type and approximate size, technology stack, coding agents used, testing period, and what you used for repository context before .knowledge."
      placeholder: |
        Role:
        Repository:
        Project type and approximate size:
        Stack:
        Coding agent(s):
        Testing period:
        Previous context setup:
    validations:
      required: true

  - type: dropdown
    id: keep-using
    attributes:
      label: "Would you keep using .knowledge in this repository?"
      options:
        - "Yes"
        - "Maybe, after specific changes"
        - "No"
        - "I do not have enough evidence yet"
    validations:
      required: true

  - type: textarea
    id: quick-summary
    attributes:
      label: "Quick summary"
      description: "In a few sentences, describe the main result, the most useful part, and the biggest obstacle."
      placeholder: |
        Main result:
        Most useful part:
        Main obstacle:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Setup and workflow fit

  - type: input
    id: installation-method
    attributes:
      label: "Installation method"
      description: "How was .knowledge installed?"
      placeholder: "Example: release asset, installation command, or manual setup"

  - type: dropdown
    id: workflow-fit
    attributes:
      label: "How naturally did .knowledge fit into your normal workflow?"
      options:
        - "It fit in without noticeably changing the workflow"
        - "It required a few extra steps"
        - "It required regular manual attention"
        - "It made the workflow significantly more complicated"
        - "I could not integrate it into normal work"
    validations:
      required: true

  - type: dropdown
    id: agent-intervention
    attributes:
      label: "Did the agent need extra guidance or intervention to use .knowledge?"
      options:
        - "No"
        - "Once or twice"
        - "Regularly"
        - "It became a blocker"
        - "Not enough evidence"
    validations:
      required: true

  - type: textarea
    id: workflow-notes
    attributes:
      label: "Workflow notes"
      description: "Where did you or the agent have to intervene? What felt convenient, awkward, unnecessary, or too complicated? What would make setup or day-to-day use easier?"
      placeholder: |
        Intervention:
        What felt natural:
        What felt awkward or unnecessary:
        Suggested improvement:

  - type: markdown
    attributes:
      value: |
        ## Real test scenario

        Describe at least one real engineering task. Installing the system or running a prepared demo alone is not enough.

  - type: textarea
    id: main-scenario
    attributes:
      label: "Main test scenario"
      description: "Describe the task, the agent used, how .knowledge was involved, the result, whether it changed the next action or engineering decision, and the supporting evidence."
      placeholder: |
        Task:
        Agent:
        How .knowledge was used:
        Result:
        What changed:
        Supporting evidence:
    validations:
      required: true

  - type: textarea
    id: additional-scenario
    attributes:
      label: "Additional scenario"
      description: "Optional. Add another real task if it revealed something different."
      placeholder: |
        Task:
        Agent:
        How .knowledge was used:
        Result:
        What changed:
        Supporting evidence:

  - type: markdown
    attributes:
      value: |
        ## Accuracy and response speed

  - type: dropdown
    id: accuracy-change
    attributes:
      label: "Did .knowledge improve the accuracy of the agent's work?"
      options:
        - "Clearly improved"
        - "Slightly improved"
        - "No clear change"
        - "Accuracy became worse"
        - "Not enough evidence to judge"
    validations:
      required: true

  - type: textarea
    id: accuracy-evidence
    attributes:
      label: "Accuracy evidence"
      description: "What changed, how did you judge it, and what concrete example supports the assessment? General observation is acceptable when clearly identified as such."
      placeholder: "Example: fewer wrong-file edits, fewer incorrect assumptions, a better first attempt, or fewer manual corrections."
    validations:
      required: true

  - type: dropdown
    id: response-speed
    attributes:
      label: "How did .knowledge affect response speed?"
      description: "Include both acceleration and added delay."
      options:
        - "Much slower (more than 25% slower)"
        - "Slightly slower (1–25% slower)"
        - "No clear change"
        - "Slightly faster (1–25% faster)"
        - "Much faster (more than 25% faster)"
        - "Not enough data"
    validations:
      required: true

  - type: input
    id: response-speed-percent
    attributes:
      label: "Optional signed speed estimate"
      description: "Use a value from -100% to +100%. Negative means slower; positive means faster."
      placeholder: "Example: +20% or -15%"

  - type: dropdown
    id: response-speed-basis
    attributes:
      label: "How was the speed impact determined?"
      options:
        - "Measured"
        - "Estimated from several comparable tasks"
        - "Based on general experience"
        - "Not enough data"
    validations:
      required: true

  - type: textarea
    id: response-speed-notes
    attributes:
      label: "What affected response speed?"
      description: "For example: less repository exploration, extra validation steps, loading generated context, retries, or manual intervention."

  - type: markdown
    attributes:
      value: |
        ## Observed results and limitations

  - type: dropdown
    id: useful-parts
    attributes:
      label: "Which parts were useful?"
      description: "Select all that apply."
      multiple: true
      options:
        - "Routing bundle"
        - "Evidence records"
        - "Trust and freshness states"
        - "Repair queue"
        - "PR summary or PR impact"
        - "Visual Inspector"
        - "Scoped search"
        - "Handoff between agents"
        - "None of the above"
        - "Other"

  - type: textarea
    id: observed-results
    attributes:
      label: "Observed results"
      description: "Describe the most useful concrete result and whether it affected final code or review. Add only metrics you actually observed."
      placeholder: |
        Most useful concrete result:
        Effect on final code or review:
        Working sessions:
        Real tasks:
        Coding agents used:
        Stale or suspect items found:
        Contradictions or unsupported claims found:
        False positives:
        False negatives:
        Incorrect or off-target first attempts:
        Manual corrections requested:
        Used more than once: Yes / No
        Used in a real pull request: Yes / No

  - type: textarea
    id: what-did-not-work
    attributes:
      label: "What did not work?"
      description: "Cover the main problem, bugs, false positives or negatives, unnecessary maintenance, confusing steps, and features you did not use."
      placeholder: |
        Main problem:
        Bugs or errors:
        False positives:
        False negatives:
        Manual work or maintenance overhead:
        Confusing terms or steps:
        Unused features and why:

  - type: markdown
    attributes:
      value: |
        ## Comparison and final assessment

  - type: textarea
    id: previous-workflow-comparison
    attributes:
      label: "Comparison with your previous workflow"
      description: "What did .knowledge add beyond AGENTS.md, CLAUDE.md, code search, or regular documentation? What did the previous workflow do better? Could the same result have been achieved more simply?"
    validations:
      required: true

  - type: textarea
    id: final-assessment
    attributes:
      label: "Final assessment"
      description: "Explain the best fit, when .knowledge would be unnecessary, the three most important improvements, and your final verdict."
      placeholder: |
        Best fit:
        When it is unnecessary:
        Three most important improvements:
        1.
        2.
        3.
        Final verdict: Does it solve a real problem, justify the extra repository layer, and would you use it again?
    validations:
      required: true

  - type: textarea
    id: supporting-material
    attributes:
      label: "Supporting material"
      description: "Optional. Add repository, PR, Issue, screenshots, or anonymized artifact excerpts. You can drag and drop files into this field."
      placeholder: |
        Repository:
        Pull request:
        Issue:
        Screenshots:
        Anonymized artifacts:

  - type: dropdown
    id: publication-permission
    attributes:
      label: "Permission to reference this report"
      options:
        - "The project may link to this report and quote short excerpts with attribution"
        - "The project may link to this report; quotes require separate permission"
        - "Keep this report on GitHub only; no external use without separate permission"
        - "Permission not decided yet"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Before publishing, review the generated discussion body and remove anything private or inaccurate. The tester's final conclusion should remain in the tester's own words.
