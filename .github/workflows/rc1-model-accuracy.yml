name: RC1 model navigation accuracy study
on:
  push:
    branches:
      - audit/3.4.0-rc1-model-study
    paths:
      - benchmarks/rc1-model-accuracy/**
      - .github/workflows/rc1-model-accuracy.yml
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Reconstruct and verify frozen inputs
        run: |
          sha256sum benchmarks/rc1-model-accuracy/PRE-REGISTRATION.md benchmarks/rc1-model-accuracy/AMENDMENT-001.md
          cat benchmarks/rc1-model-accuracy/dataset.part*.b64 > benchmarks/rc1-model-accuracy/dataset.json.gz.b64
          base64 -d benchmarks/rc1-model-accuracy/run_local.py.gz.b64 | gzip -d > benchmarks/rc1-model-accuracy/run_local.py
          test "$(sha256sum benchmarks/rc1-model-accuracy/run_local.py | cut -d' ' -f1)" = "73563a46af182da1a4c80b07ab4a86f881c776d19a02daac070a77286ea75cff"
          python -c "import base64,gzip,json,pathlib; p=pathlib.Path('benchmarks/rc1-model-accuracy/dataset.json.gz.b64'); d=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip()))); assert d['candidate']['sha256']=='7686150325c43ae18229793ec8721b49a85c89149c042b8f963202ab9bd1dc6f'; assert d['dataset_sha256']=='c82ecd442ffc0fec8ada459493368edabe72964b9ee4e3f45a8db754944b2f80'; print(d['dataset_sha256'])"
      - name: Install pinned inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.48.3 safetensors==0.5.2
      - name: Run amended frozen local-model study
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python benchmarks/rc1-model-accuracy/run_local.py
      - name: Capture environment
        if: always()
        run: |
          mkdir -p model-study-output
          python --version > model-study-output/python-version.txt
          python -m pip freeze > model-study-output/pip-freeze.txt
          uname -a > model-study-output/environment.txt
      - name: Upload model study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-local-model-navigation-accuracy
          path: model-study-output/
          if-no-files-found: error
          retention-days: 30
