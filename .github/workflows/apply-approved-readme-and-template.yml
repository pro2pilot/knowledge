name: Apply approved README and Field Report template

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-approved-readme-and-template.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PRO2PILOT_DISCUSSIONS_TOKEN }}
      EXPECTED_ACTOR: pro2pilot
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify publisher identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "PRO2PILOT_DISCUSSIONS_TOKEN is missing" >&2; exit 1; }
          VIEWER="$(gh api user --jq .login)"
          test "$VIEWER" = "$EXPECTED_ACTOR" || {
            echo "Expected $EXPECTED_ACTOR, got $VIEWER" >&2
            exit 1
          }

      - name: Apply approved README and current Field Report guidance
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp/README-v3.4.0.md README.md

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/DISCUSSION_TEMPLATE/field-reports.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'description: "Share evidence from real .knowledge use."':
                  'description: "Share evidence from real .knowledge use through a local, reviewable workflow."',
              'value: "Starting with `.knowledge` 3.3.0, you can prepare this report semi-automatically with the `field-report` command. Answer in any language; the publication-ready draft is always English and requires tester-approved translation when needed. Only include things you actually observed. Review the final title and body before publishing, and never include secrets, private source code, personal data, internal workspace names, or internal addresses."':
                  'value: "With `.knowledge` 3.4.0, you can prepare this report manually or semi-automatically with the local `field-report` workflow. Answer in any language; the publication-ready draft is always English, and non-English publication prose requires identity-attributed translation plus independent tester approval. The workflow builds public output from allowlisted local facts, keeps verified task outcome separate from `.knowledge` system health, generalizes or redacts sensitive values, and requires review, exact approval, and a separately confirmed publication preview before any remote create. Only include things you actually observed, and never include secrets, private source code, personal data, internal workspace names, or internal addresses."',
              'placeholder: "Example: 3.3.0"':
                  'placeholder: "Example: 3.4.0"',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one template match, found {count}: {old[:80]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'assets/knowledge-trust-gate-light-readme.svg' README.md
          grep -Fq 'Codex, Claude Code, OpenCode, OpenClaw, Hermes, Gemini CLI, GitHub Copilot, Devin, Windsurf, Continue, Roo Code, Aider, and others.' README.md
          grep -Fq 'https://github.com/pro2pilot/knowledge/discussions/4' README.md
          ! grep -Fq '{{FIELD_REPORT_DISCUSSION_URL}}' README.md
          grep -Fq 'Example: 3.4.0' .github/DISCUSSION_TEMPLATE/field-reports.yml
          git diff --check

      - name: Commit and push approved docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pro2Pilot"
          git config user.email "github@pro2pilot.com"
          git add README.md .github/DISCUSSION_TEMPLATE/field-reports.yml
          git commit -m "docs: refresh README and Field Report guidance for 3.4.0"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
