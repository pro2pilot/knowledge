name: RC5 Darwin native broker qualification
on:
  push:
    branches: ['codex/rc5-darwin-broker-matrix']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact preliminary native source
        run: python3 qa/darwin-broker/compile_native.py
      - name: Verify source copy primitives on macOS
        if: always()
        run: python3 qa/darwin-broker/verify_copy_pins.py
      - name: Native isolated-copy positive control
        if: always()
        run: python3 qa/darwin-broker/run_native_smoke.py
      - name: Audit-only credential and host-port probes
        if: always()
        run: python3 qa/darwin-broker/run_security_probes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-native-attempt8-${{ matrix.os }}
          path: |
            qa/darwin-broker/SOURCE_RECEIPT.json
            qa/darwin-broker/evidence/*.json
            qa/darwin-broker/evidence/*.log
            qa/darwin-broker/evidence/*.tap
            qa/darwin-broker/evidence/*.sb
  portable-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact copy/client source on Linux
        run: python3 qa/darwin-broker/verify_copy_pins.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-copy-attempt8-linux
          path: qa/darwin-broker/evidence/*
