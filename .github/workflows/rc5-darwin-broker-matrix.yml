name: RC5 Darwin broker diagnostic matrix
on:
  push:
    branches: ['codex/rc5-darwin-broker-matrix']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: ${{ !contains(github.event.head_commit.message, '[sip-probe-only]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact audit ZIP against selected compile and module inputs
        run: python3 qa/darwin-broker/validate_candidate_input.py
      - name: Compile exact preliminary native source
        run: python3 qa/darwin-broker/compile_native.py
      - name: Test pinned portable modules
        run: python3 qa/darwin-broker/verify_copy_pins.py
      - name: Test bounded C wire parser
        run: python3 qa/darwin-broker/check_stub_wire.py
      - name: Compile read-only UID observer
        run: /usr/bin/clang -std=c11 -O2 -Wall -Wextra qa/darwin-broker/uid-scan.c -o qa/darwin-broker/evidence/uid-scan
      - name: Test exact current native UID history component
        if: always()
        run: python3 qa/darwin-broker/run_uid_history_selftest.py
      - name: Test installed pinned broker and continuous drain barrier
        if: always()
        run: python3 qa/darwin-broker/run_launchd_smoke.py --harness=qa/darwin-broker/daemon-harness-m2.py --m2-scenario=normal --check-init-cli --expected-source-sha=3c7df9d59708faf16930efc732696d92f8eb9b68c953fcbe116751fbdb7dc89e
      - name: Interrupt pending command drain with terminal close
        if: always()
        run: python3 qa/darwin-broker/run_launchd_smoke.py --harness=qa/darwin-broker/daemon-harness-m2.py --m2-scenario=interrupt_drain --expected-source-sha=3c7df9d59708faf16930efc732696d92f8eb9b68c953fcbe116751fbdb7dc89e
      - name: Preserve missing active registry without recreating it
        if: always()
        run: python3 qa/darwin-broker/run_launchd_smoke.py --harness=qa/darwin-broker/uid-registry-fault-harness.py --uid-registry-fault=unlink --expected-source-sha=3c7df9d59708faf16930efc732696d92f8eb9b68c953fcbe116751fbdb7dc89e
      - name: Preserve corrupted active registry without overwriting it
        if: always()
        run: python3 qa/darwin-broker/run_launchd_smoke.py --harness=qa/darwin-broker/uid-registry-fault-harness.py --uid-registry-fault=corrupt --expected-source-sha=3c7df9d59708faf16930efc732696d92f8eb9b68c953fcbe116751fbdb7dc89e
      - name: Stop quiet private work after policy loss without RPC
        if: always()
        run: python3 qa/darwin-broker/run_launchd_smoke.py --active-state-fault=policy-unlink --expected-source-sha=3c7df9d59708faf16930efc732696d92f8eb9b68c953fcbe116751fbdb7dc89e
      - name: Stop quiet private work after registry loss without RPC
        if: always()
        run: python3 qa/darwin-broker/run_launchd_smoke.py --active-state-fault=registry-unlink --expected-source-sha=3c7df9d59708faf16930efc732696d92f8eb9b68c953fcbe116751fbdb7dc89e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-native-attempt26-${{ matrix.os }}
          path: |
            qa/darwin-broker/SOURCE_RECEIPT.json
            qa/darwin-broker/CANDIDATE_INPUT_RECEIPT.json
            qa/darwin-broker/CANDIDATE_INPUT_RESULT.json
            qa/darwin-broker/evidence/*.json
            qa/darwin-broker/evidence/*.log
            qa/darwin-broker/evidence/*.tap
            qa/darwin-broker/evidence/*.sb
            qa/darwin-broker/evidence/launchd-smoke-*/**/*
            qa/darwin-broker/evidence/uid-history/**/*
  portable:
    if: ${{ !contains(github.event.head_commit.message, '[sip-probe-only]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check exact audit ZIP against selected portable inputs
        run: python3 qa/darwin-broker/validate_candidate_input.py
      - name: Test exact pinned portable modules
        run: python3 qa/darwin-broker/verify_copy_pins.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-portable-attempt26-ubuntu-22.04
          path: |
            qa/darwin-broker/COPY_SOURCE_RECEIPT.json
            qa/darwin-broker/CANDIDATE_INPUT_RECEIPT.json
            qa/darwin-broker/CANDIDATE_INPUT_RESULT.json
            qa/darwin-broker/evidence/*.json
            qa/darwin-broker/evidence/*.log
            qa/darwin-broker/evidence/*.tap
