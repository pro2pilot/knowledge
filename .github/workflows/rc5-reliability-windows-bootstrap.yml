name: RC5 reliability Windows graceful progress and public KVE
on:
  workflow_dispatch:
  push:
    branches: [codex/rc5-reliability-20261025]
    paths: ['qa/reliability/windows-progress-03/**', '.github/workflows/rc5-reliability-windows-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: rc5-reliability-windows-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set Visual C environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Rehydrate exact source bytes from pinned ancestor
        run: python qa/reliability/windows-progress-03/transport/rehydrate_zip.py --base qa/reliability/runtime-qa/SOURCE.zip --descriptor qa/reliability/windows-progress-03/transport/TRANSPORT.json --out qa/reliability/windows-progress-03/SOURCE.zip
      - name: Build and run native bootstrap and public KVE scenarios
        run: python qa/reliability/windows-progress-03/native_qa.py --archive qa/reliability/windows-progress-03/SOURCE.zip --manifest qa/reliability/windows-progress-03/SOURCE_MANIFEST.json --out windows-bootstrap
      - name: Retain exact raw evidence and native build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-windows-bootstrap-${{ matrix.os }}-${{ matrix.arch }}
          path: windows-bootstrap/public/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
