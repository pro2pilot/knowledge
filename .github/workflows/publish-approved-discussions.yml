name: Publish approved Pro2Pilot discussions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-approved-discussions.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PRO2PILOT_DISCUSSIONS_TOKEN }}
      REPOSITORY: pro2pilot/knowledge
      EXPECTED_ACTOR: pro2pilot
      FIELD_TITLE: "Field Reports: share real-world .knowledge experience without exposing sensitive information"
      RELEASE_TITLE: ".knowledge 3.4.0 is out: a task-scoped workflow, a 9-cell compatibility matrix, and a 48-case routing stress test—without invented claims"
    steps:
      - name: Check out approved post bodies
        uses: actions/checkout@v4

      - name: Verify publisher identity and resolve category
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "PRO2PILOT_DISCUSSIONS_TOKEN is missing" >&2; exit 1; }

          QUERY='query($owner:String!,$name:String!){viewer{login} repository(owner:$owner,name:$name){id discussionCategories(first:100){nodes{id name slug}}}}'
          META="$(gh api graphql -f query="$QUERY" -f owner=pro2pilot -f name=knowledge)"
          printf '%s\n' "$META" > discussion-metadata.json

          VIEWER="$(jq -r '.data.viewer.login' discussion-metadata.json)"
          test "$VIEWER" = "$EXPECTED_ACTOR" || {
            echo "Expected publisher $EXPECTED_ACTOR, got $VIEWER" >&2
            exit 1
          }

          REPOSITORY_ID="$(jq -r '.data.repository.id' discussion-metadata.json)"
          CATEGORY_ID="$(jq -r '[.data.repository.discussionCategories.nodes[] | select((.slug == "announcements") or (.name == "Announcements"))][0].id // empty' discussion-metadata.json)"
          CATEGORY_NAME="Announcements"
          if [ -z "$CATEGORY_ID" ]; then
            CATEGORY_ID="$(jq -r '[.data.repository.discussionCategories.nodes[] | select((.slug == "general") or (.name == "General"))][0].id // empty' discussion-metadata.json)"
            CATEGORY_NAME="General"
          fi
          test -n "$CATEGORY_ID" || {
            echo "Neither Announcements nor General discussion category exists" >&2
            jq '.data.repository.discussionCategories.nodes' discussion-metadata.json >&2
            exit 1
          }

          echo "repository_id=$REPOSITORY_ID" >> "$GITHUB_OUTPUT"
          echo "category_id=$CATEGORY_ID" >> "$GITHUB_OUTPUT"
          echo "category_name=$CATEGORY_NAME" >> "$GITHUB_OUTPUT"
          echo "publisher=$VIEWER" >> "$GITHUB_OUTPUT"

      - name: Prepare approved bodies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def strip_h1(source: str, destination: str) -> None:
              text = Path(source).read_text(encoding="utf-8")
              lines = text.splitlines()
              if lines and lines[0].startswith("# "):
                  lines = lines[1:]
                  if lines and not lines[0].strip():
                      lines = lines[1:]
              Path(destination).write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          strip_h1(".github/tmp/field-report-explainer.md", "field-report-body.md")
          strip_h1(".github/tmp/v340-release-post.md", "release-body-template.md")
          PY

      - name: Publish Field Report explainer first
        id: field
        shell: bash
        env:
          REPOSITORY_ID: ${{ steps.metadata.outputs.repository_id }}
          CATEGORY_ID: ${{ steps.metadata.outputs.category_id }}
        run: |
          set -euo pipefail

          EXISTING_QUERY='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){discussions(first:100,orderBy:{field:CREATED_AT,direction:DESC}){nodes{title url number category{name slug}}}}}'
          EXISTING="$(gh api graphql -f query="$EXISTING_QUERY" -f owner=pro2pilot -f name=knowledge)"
          FIELD_URL="$(printf '%s' "$EXISTING" | jq -r --arg title "$FIELD_TITLE" '.data.repository.discussions.nodes[] | select(.title == $title) | .url' | head -n1)"

          if [ -z "$FIELD_URL" ]; then
            MUTATION='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{number url title category{name slug}}}}'
            RESPONSE="$(gh api graphql \
              -f query="$MUTATION" \
              -f repositoryId="$REPOSITORY_ID" \
              -f categoryId="$CATEGORY_ID" \
              -f title="$FIELD_TITLE" \
              -f body="$(cat field-report-body.md)")"
            printf '%s\n' "$RESPONSE" > field-report-create-response.json
            FIELD_URL="$(printf '%s' "$RESPONSE" | jq -r '.data.createDiscussion.discussion.url')"
          else
            printf '{"reused":true,"url":%s}\n' "$(jq -Rn --arg v "$FIELD_URL" '$v')" > field-report-create-response.json
          fi

          test -n "$FIELD_URL" && test "$FIELD_URL" != "null"
          echo "url=$FIELD_URL" >> "$GITHUB_OUTPUT"
          echo "Published/reused Field Report explainer: $FIELD_URL"

      - name: Link Field Report explainer and publish 3.4.0 post
        id: release
        shell: bash
        env:
          FIELD_URL: ${{ steps.field.outputs.url }}
          REPOSITORY_ID: ${{ steps.metadata.outputs.repository_id }}
          CATEGORY_ID: ${{ steps.metadata.outputs.category_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path("release-body-template.md").read_text(encoding="utf-8")
          marker = "{{FIELD_REPORT_DISCUSSION_URL}}"
          if marker not in text:
              raise SystemExit("Field Report URL marker missing from release post")
          Path("release-body.md").write_text(text.replace(marker, os.environ["FIELD_URL"]), encoding="utf-8")
          PY

          EXISTING_QUERY='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){discussions(first:100,orderBy:{field:CREATED_AT,direction:DESC}){nodes{title url number category{name slug}}}}}'
          EXISTING="$(gh api graphql -f query="$EXISTING_QUERY" -f owner=pro2pilot -f name=knowledge)"
          RELEASE_URL="$(printf '%s' "$EXISTING" | jq -r --arg title "$RELEASE_TITLE" '.data.repository.discussions.nodes[] | select(.title == $title) | .url' | head -n1)"

          if [ -z "$RELEASE_URL" ]; then
            MUTATION='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{number url title category{name slug}}}}'
            RESPONSE="$(gh api graphql \
              -f query="$MUTATION" \
              -f repositoryId="$REPOSITORY_ID" \
              -f categoryId="$CATEGORY_ID" \
              -f title="$RELEASE_TITLE" \
              -f body="$(cat release-body.md)")"
            printf '%s\n' "$RESPONSE" > release-create-response.json
            RELEASE_URL="$(printf '%s' "$RESPONSE" | jq -r '.data.createDiscussion.discussion.url')"
          else
            printf '{"reused":true,"url":%s}\n' "$(jq -Rn --arg v "$RELEASE_URL" '$v')" > release-create-response.json
          fi

          test -n "$RELEASE_URL" && test "$RELEASE_URL" != "null"
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "Published/reused 3.4.0 discussion: $RELEASE_URL"

      - name: Verify both live discussions
        shell: bash
        env:
          FIELD_URL: ${{ steps.field.outputs.url }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          FIELD_NUMBER="${FIELD_URL##*/}"
          RELEASE_NUMBER="${RELEASE_URL##*/}"

          FIELD="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){discussion(number:$number){title body url author{login} category{name slug}}}}' -f owner=pro2pilot -f name=knowledge -F number="$FIELD_NUMBER")"
          RELEASE="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){discussion(number:$number){title body url author{login} category{name slug}}}}' -f owner=pro2pilot -f name=knowledge -F number="$RELEASE_NUMBER")"
          printf '%s\n' "$FIELD" > field-report-live.json
          printf '%s\n' "$RELEASE" > release-live.json

          test "$(jq -r '.data.repository.discussion.author.login' field-report-live.json)" = "$EXPECTED_ACTOR"
          test "$(jq -r '.data.repository.discussion.author.login' release-live.json)" = "$EXPECTED_ACTOR"
          test "$(jq -r '.data.repository.discussion.title' field-report-live.json)" = "$FIELD_TITLE"
          test "$(jq -r '.data.repository.discussion.title' release-live.json)" = "$RELEASE_TITLE"
          grep -Fq "$FIELD_URL" <(jq -r '.data.repository.discussion.body' release-live.json)

      - name: Persist publication receipt for follow-up updates
        shell: bash
        env:
          FIELD_URL: ${{ steps.field.outputs.url }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          CATEGORY_NAME: ${{ steps.metadata.outputs.category_name }}
          PUBLISHER: ${{ steps.metadata.outputs.publisher }}
        run: |
          set -euo pipefail
          jq -n \
            --arg status success \
            --arg publisher "$PUBLISHER" \
            --arg category "$CATEGORY_NAME" \
            --arg field_report_explainer_url "$FIELD_URL" \
            --arg release_340_url "$RELEASE_URL" \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{status:$status,publisher:$publisher,category:$category,field_report_explainer_url:$field_report_explainer_url,release_340_url:$release_340_url,run_url:$run_url}' \
            > published-discussions.json

          CURRENT_SHA="$(gh api "repos/${REPOSITORY}/contents/.github/tmp/published-discussions.json" --jq .sha)"
          CONTENT="$(base64 -w0 published-discussions.json)"
          gh api --method PUT "repos/${REPOSITORY}/contents/.github/tmp/published-discussions.json" \
            -f message='chore: record approved Discussion publication URLs' \
            -f content="$CONTENT" \
            -f sha="$CURRENT_SHA" \
            -f branch=main \
            >/dev/null

          {
            echo "## Published Discussions"
            echo
            echo "- Field Report explainer: $FIELD_URL"
            echo "- .knowledge 3.4.0: $RELEASE_URL"
            echo "- Publisher: $PUBLISHER"
            echo "- Category: $CATEGORY_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
