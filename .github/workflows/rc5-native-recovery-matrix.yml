name: RC5 physical Linux recovery followup
on:
  push:
    branches: ['codex/rc5-native-recovery-matrix']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            identity: root
          - os: ubuntu-22.04
            identity: user
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - name: Verify pinned source and use an owned native fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('qa/native-recovery'); expected=json.loads((root/'SOURCE_RECEIPT.json').read_text())['source_files']
          actual={p.relative_to(root/'source/.knowledge').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in (root/'source/.knowledge').rglob('*') if p.is_file()}
          assert actual==expected,'Source drift before execution'
          PY
          out="$PWD/qa/native-recovery/evidence"
          mkdir -p "$out"
          nodebin="$(node -p 'process.execPath')"
          pybin="$(command -v python3)"
          gitbin="$(command -v git)"
          code='const b=require("./source/.knowledge/tools/lib/verification-linux-namespace");try{console.log(JSON.stringify({helper:b.prepareHelper(),capability:b.containmentCapability()}));}catch(e){console.log(JSON.stringify({code:e.code,message:e.message}));process.exitCode=1;}'
          if [ '${{ matrix.identity }}' = root ]; then
            work=$(sudo /usr/bin/mktemp -d /tmp/knowledge-rc5-root.XXXXXXXX)
            sudo /bin/cp -R qa/native-recovery/. "$work"
            sudo /usr/bin/env TMPDIR="$work" "$nodebin" -e 'const b=require(process.argv[1]);try{console.log(JSON.stringify(b.prepareHelper()));}catch(e){console.log(JSON.stringify({code:e.code,message:e.message}));}' "$PWD/qa/native-recovery/source/.knowledge/tools/lib/verification-linux-namespace.js" > "$out/checkout-root-build-diagnostic.json"
          else
            work=$(/usr/bin/mktemp -d /tmp/knowledge-rc5-user.XXXXXXXX)
            /bin/cp -R qa/native-recovery/. "$work"
          fi
          printf '%s\n' "$work" > "$out/owned-fixture-path.txt"
          case "$work" in /tmp/knowledge-rc5-root.*|/tmp/knowledge-rc5-user.*) ;; *) exit 71 ;; esac
          if [ '${{ matrix.identity }}' = installed-user ]; then
            "$pybin" - "$work" <<'PY'
          from pathlib import Path
          import zipfile,hashlib,sys
          work=Path(sys.argv[1]);asset=work/'runtime/knowledge-v3.4.4.zip'
          assert hashlib.sha256(asset.read_bytes()).hexdigest()=='b2eb1d3ce8942a176c218c8b102421427eca8ea870f1cfddaa99d5fbd54397c2'
          with zipfile.ZipFile(asset) as z:
              names=z.namelist();assert len(names)==415 and len({n.casefold() for n in names})==415
              assert all(n.startswith('.knowledge/') and '..' not in n.split('/') and '\\' not in n for n in names)
              for fixture in ['fresh-node','project spaces пример']:
                  root=work/'installed/fixtures'/fixture;root.mkdir(parents=True)
                  for name in names:
                      p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          PY
            set +e
            "$nodebin" "$work/tools/run-installed.cjs" "$work/installed"
            rc=$?
            set -e
            "$pybin" - "$work" "$out" <<'PY'
          from pathlib import Path
          import shutil,sys,json,hashlib
          work,out=map(Path,sys.argv[1:]);target=out/'installed-linux';target.mkdir(parents=True)
          for p in (work/'installed').rglob('*'):
              if p.is_file() and '.knowledge' not in p.relative_to(work/'installed').parts:
                  q=target/p.relative_to(work/'installed');q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
          (target/'ASSET_RECEIPT.json').write_text(json.dumps({'sha256':hashlib.sha256((work/'runtime/knowledge-v3.4.4.zip').read_bytes()).hexdigest(),'scope':'physical Linux installed exact audit ZIP; no source checkout substitution'},indent=2)+'\n')
          PY
            exit "$rc"
          fi
          args=(--source "$work/source/.knowledge" --node "$nodebin" --git "$gitbin" --label linux-${{ matrix.identity }}-attempt5 --timeout 1200
            --only self-test-linux-namespace
            --only tests__verification-native-recovery-linux.test.js
            --only tests__native-linux-execution-contract.test.js
            --only tests__verification-native-recovery.test.js
            --only tests__verification-cleanup-transcript.test.js
            --only tests__verification-finalization-v2.test.js
            --only self-test-verification-finalization
            --only self-test-verification-budget
            --only self-test-verification-execution)
          set +e
          if [ '${{ matrix.identity }}' = root ]; then
            sudo "$nodebin" -e 'const b=require(process.argv[1]);try{console.log(JSON.stringify({helper:b.prepareHelper(),capability:b.containmentCapability()}));}catch(e){console.log(JSON.stringify({code:e.code,message:e.message}));process.exitCode=1;}' "$work/source/.knowledge/tools/lib/verification-linux-namespace.js" > "$out/native-prerequisite.json" 2> "$out/native-prerequisite.stderr"
            sudo "$pybin" "$work/tools/run_audit.py" "${args[@]}"
            rc=$?
            sudo /bin/cp -R "$work/evidence/." "$out"
          else
            (cd "$work" && "$nodebin" -e "$code") > "$out/native-prerequisite.json" 2> "$out/native-prerequisite.stderr"
            "$pybin" "$work/tools/run_audit.py" "${args[@]}"
            rc=$?
            /bin/cp -R "$work/evidence/." "$out"
          fi
          set -e
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc5-linux-${{ matrix.identity }}-native-evidence
          path: |
            qa/native-recovery/evidence
            qa/native-recovery/SOURCE_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
