name: RC5 exact continuation native matrix

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact cohort phase; full adds physical macOS lifecycle
        required: true
        default: full
        type: choice
        options: [diagnostic, full]
  push:
    branches: [codex/rc5-reliability-final-20261026]
    paths:
      - qa/reliability/continuation-20261026/**
      - qa/reliability/controllers/**
      - .github/workflows/rc5-continuation.yml

permissions:
  contents: read

concurrency:
  group: rc5-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-continuation:
    name: ${{ matrix.id }} exact continuation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { id: macos-arm64-writable, runner: macos-15, platform: darwin, arch: arm64, macos_cohort: writable }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure native Windows compiler
        if: matrix.platform == 'win32'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Reconstruct and verify the exact frozen source
        run: |
          python qa/reliability/linux-final-01/transport/rehydrate_zip.py --base qa/reliability/runtime-qa/SOURCE.zip --descriptor qa/reliability/linux-final-01/transport/TRANSPORT.json --out qa/reliability/linux-final-01/SOURCE.zip
          python qa/reliability/continuation-20261026/prepare.py --base-archive qa/reliability/linux-final-01/SOURCE.zip --base-manifest qa/reliability/linux-final-01/SOURCE_MANIFEST.json --overlay qa/reliability/continuation-20261026/frozen-integrated-04/OVERLAY.json --out continuation-source
      - name: Execute source-bound native and public tests
        run: python qa/reliability/continuation-20261026/run-ci.py --prepared continuation-source --out continuation-evidence --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --phase '${{ github.event.inputs.phase || 'full' }}' --macos-cohort '${{ matrix.macos_cohort || 'combined' }}'
      - name: Retain public evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc5-continuation-${{ matrix.id }}-${{ github.sha }}
          path: continuation-evidence/public/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
