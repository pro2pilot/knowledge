name: RC5 audit7 bounded ARM Team normal-flow diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/rc5-blocker-fixes-20261027]
    paths: [.github/workflows/rc5-audit7-team-arm-diagnostic.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: rc5-audit7-team-arm-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normal-flow-only:
    runs-on: windows-11-arm
    timeout-minutes: 7
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          architecture: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: audit7-budget-fixtures-exact-zip
          path: downloaded-package
          run-id: 40649827600
          github-token: ${{ github.token }}
      - name: Observe complete normal Team flow without changing product deadlines
        run: python qa/reliability/audit7/windows_repair_qa.py --only-team --package downloaded-package/public --arch arm64 --out installed-contract
      - name: Preserve result without promoting prior cancellation cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit7-team-arm-normal-flow-only
          path: |
            installed-contract/RESULT.json
            installed-contract/*.stdout.json
            installed-contract/*.stderr.txt
            installed-contract/team-failure-evidence/**
          if-no-files-found: error
          retention-days: 3
