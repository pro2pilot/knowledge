name: Linux admin service boundary QA
# Revision 3: same-UID peer delegation and stale STOP after actual FD reuse.

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rc5-blocker-fixes-20261027
    paths:
      - .github/workflows/rc5-linux-service-boundary.yml

permissions:
  contents: read

jobs:
  linux-admin-boundary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact service source as the runner
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/linux-admin-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$scratch" > "$RUNNER_TEMP/linux-admin-service-scratch-path"
          python3 qa/reliability/linux-admin-service-27/native_boundary_qa.py prepare --scratch "$scratch"
      - name: Run bounded root-owned system-service boundary checks
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(cat "$RUNNER_TEMP/linux-admin-service-scratch-path")"
          sudo -n --preserve-env=GITHUB_SHA python3 qa/reliability/linux-admin-service-27/native_boundary_qa.py run \
            --scratch "$scratch" --public "$scratch/public"
      - name: Upload sanitized result summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-admin-service-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-admin-service-*/public/RESULT.json
          if-no-files-found: warn
          retention-days: 3
