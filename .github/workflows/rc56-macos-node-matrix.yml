name: RC56 macOS and Node compatibility matrix

on:
  push:
    branches:
      - agent/rc56-os-node-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: macos-node18
            node: 18.20.8
            upgrade: false
            runner: macos-15-intel
          - slug: macos-node20
            node: 20.20.2
            upgrade: false
            runner: macos-13
          - slug: macos-node22
            node: 22.23.1
            upgrade: true
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: ''
          package-manager-cache: false

      - name: Verify immutable inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = 'qa/rc56/knowledge-v3.3.0.zip'
          $baseline = 'qa/rc56/knowledge-v3.2.11.zip'
          $expectedCandidate = '94c870497ddeeb017dab8c34feb79088478aba7e872a8f2bb137ab7c65e95726'
          $expectedBaseline = 'b7f4e912e8bcffff1e2ffb35756d68850a980b6b841306ac7a51c9d88fc59d79'
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedCandidate) { throw 'candidate SHA mismatch' }
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedBaseline) { throw 'baseline SHA mismatch' }
          node -e "const fs=require('fs'),crypto=require('crypto'),path=require('path');const root='qa/rc56/replay';const manifest=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));for(const item of manifest.files||[]){const actual=crypto.createHash('sha256').update(fs.readFileSync(path.join(root,item.path))).digest('hex');if(actual!==item.sha256)throw new Error('replay manifest mismatch: '+item.path)};console.log('replay manifest pass')"

      - name: Run external matrix cell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP "rc56-${{ matrix.slug }}"
          $out = Join-Path $work 'cell'
          $published = Join-Path $env:GITHUB_WORKSPACE "qa-results/${{ matrix.slug }}"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $nodeMajor = '${{ matrix.node }}'.Split('.')[0]
          & node qa/rc56/run-matrix-cell.js `
            --candidate (Resolve-Path 'qa/rc56/knowledge-v3.3.0.zip') `
            --replay (Resolve-Path 'qa/rc56/replay') `
            --baseline (Resolve-Path 'qa/rc56/knowledge-v3.2.11.zip') `
            --out $out `
            --os macos `
            --node-major $nodeMajor `
            --upgrade='${{ matrix.upgrade }}' `
            --expected-candidate '94c870497ddeeb017dab8c34feb79088478aba7e872a8f2bb137ab7c65e95726' `
            --expected-baseline 'b7f4e912e8bcffff1e2ffb35756d68850a980b6b841306ac7a51c9d88fc59d79'
          $exitCode = $LASTEXITCODE
          if (Test-Path $out) { Copy-Item -LiteralPath $out -Destination $published -Recurse -Force }
          exit $exitCode

      - name: Upload per-cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc56-${{ matrix.slug }}
          path: qa-results/${{ matrix.slug }}/
          include-hidden-files: true
          if-no-files-found: error

      - name: Enforce cell verdict
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = 'qa-results/${{ matrix.slug }}/result.json'
          if (!(Test-Path $result)) { throw 'cell result.json missing' }
          $body = Get-Content -Raw $result | ConvertFrom-Json
          if ($body.status -ne 'pass') { throw "cell failed: $($body.error.message)" }
          $tests = Get-Content -Raw 'qa-results/${{ matrix.slug }}/self-tests.json' | ConvertFrom-Json
          if ($tests.status -ne 'pass' -or $tests.passed -ne 26 -or $tests.failed -ne 0) { throw 'shipped self-tests are not 26/26' }
