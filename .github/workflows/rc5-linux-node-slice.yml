name: Linux ARM64 Node service-slice component QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc5-linux-node-slice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-node-slice:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          architecture: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run importer, controller, and generated child regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test qa/reliability/linux-service-slice-27/importer.test.js
          python3 -B -m unittest discover -s qa/reliability/linux-service-slice-27 -p "test_*.py"
      - name: Prepare pinned ARM64 component and validate its receipt
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          receipt_file="$RUNNER_TEMP/linux-node-slice-prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          stderr_file="$RUNNER_TEMP/linux-node-slice-prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.stderr"
          before_scratch="$(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in Path("/tmp").glob("knowledge-slice-prep-*")))')"
          set +e
          python3 qa/reliability/linux-service-slice-27/controller.py prepare > "$receipt_file" 2> "$stderr_file"
          prepare_rc=$?
          set -e
          run_id=""
          if [[ "$prepare_rc" -eq 0 ]]; then
            set +e
            run_id="$(python3 - "$receipt_file" <<'PY'
          import json, pathlib, re, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"status", "run_id", "architecture", "node_version", "node_sha256", "native_sha256", "input_sha256", "fault_mode"}
          if set(value) != expected or value.get("status") != "PREPARED_COMPONENT_QA" or \
             value.get("architecture") != "aarch64" or value.get("node_version") != "v22.17.1" or \
             type(value.get("fault_mode")) is not int or value["fault_mode"] != 0 or \
             not re.fullmatch(r"[a-f0-9]{32}", value.get("run_id", "")):
              raise SystemExit("prepare receipt did not match the fixed schema")
          for key in ("node_sha256", "native_sha256", "input_sha256"):
              if not re.fullmatch(r"[a-f0-9]{64}", value.get(key, "")):
                  raise SystemExit("prepare receipt contains an invalid digest")
          print(value["run_id"])
          PY
          )"
            receipt_rc=$?
            set -e
          else
            receipt_rc=1
          fi
          if [[ "$prepare_rc" -ne 0 || "$receipt_rc" -ne 0 ]]; then
            public="$RUNNER_TEMP/linux-node-slice-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/public"
            mkdir -p "$public"
            chmod 0755 "$public"
            python3 - "$stderr_file" "$public/prepare-receipt.json" "$before_scratch" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          source, destination = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          before = set(sys.argv[3].splitlines())
          try:
              with source.open("rb") as stream:
                  sample = stream.read(256 * 1024 + 1)
          except OSError:
              sample = b""
          truncated = len(sample) > 256 * 1024
          sample = sample[:256 * 1024]
          compiler_excerpt = ""
          compiler_sample_sha256 = None
          compiler_sample_bytes = 0
          compiler_truncated = False
          candidates = []
          for candidate in pathlib.Path("/tmp").glob("knowledge-slice-prep-*"):
              if str(candidate) in before or not re.fullmatch(r"knowledge-slice-prep-[a-f0-9]{32}", candidate.name):
                  continue
              try:
                  identity = candidate.lstat()
              except OSError:
                  continue
              if pathlib.Path(candidate).is_dir() and not candidate.is_symlink() and identity.st_uid == os.getuid() and \
                 (identity.st_mode & 0o7777) == 0o700:
                  candidates.append(candidate)
          if len(candidates) == 1:
              log = candidates[0] / "prepare-private" / "compile.stderr.bin"
              try:
                  info = log.lstat()
                  if info.st_uid == os.getuid() and info.st_nlink == 1 and (info.st_mode & 0o7777) == 0o600 and \
                     info.st_size <= 128 * 1024 and log.is_file() and not log.is_symlink():
                      with log.open("rb") as stream:
                          compiler_bytes = stream.read(16 * 1024 + 1)
                      compiler_truncated = len(compiler_bytes) > 16 * 1024 or info.st_size > 16 * 1024
                      compiler_bytes = compiler_bytes[:16 * 1024]
                      compiler_sample_sha256 = hashlib.sha256(compiler_bytes).hexdigest()
                      compiler_sample_bytes = len(compiler_bytes)
                      compiler_excerpt = compiler_bytes.decode("utf-8", "replace").replace(str(candidates[0]), "<scratch>")
                      compiler_excerpt = "".join(ch for ch in compiler_excerpt if ch in "\n\r\t" or ord(ch) >= 32)
              except OSError:
                  pass
          value = {"schema_version": "knowledge-linux-service-slice-prepare-receipt.v1",
                   "status": "PREPARE_FAILED", "reason": "prepare_or_receipt_validation_failed",
                   "stderr_sample_sha256": hashlib.sha256(sample).hexdigest(),
                   "stderr_sample_bytes": len(sample), "stderr_sample_truncated": truncated,
                   "raw_stderr_uploaded": False, "compiler_stderr_excerpt": compiler_excerpt,
                   "compiler_stderr_sample_sha256": compiler_sample_sha256,
                   "compiler_stderr_sample_bytes": compiler_sample_bytes,
                   "compiler_stderr_sample_truncated": compiler_truncated}
          destination.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          os.chmod(destination, 0o644)
          PY
            printf 'run_id=\npublic_dir=%s\n' "$public" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          scratch="/tmp/knowledge-slice-prep-${run_id}"
          test -d "$scratch/public"
          install -m 0644 "$receipt_file" "$scratch/public/prepare-receipt.json"
          printf 'run_id=%s\npublic_dir=%s\n' "$run_id" "$scratch/public" >> "$GITHUB_OUTPUT"
      - name: Run the fixed root-owned native component controller
        id: run-component
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.prepare.outputs.run_id }}'
          [[ "$run_id" =~ ^[a-f0-9]{32}$ ]]
          sudo -n python3 qa/reliability/linux-service-slice-27/controller.py run --run-id "$run_id"
      - name: Write acceptance record after controller exit
        id: finalize-result
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run-component.outcome }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
          PUBLIC_DIR: ${{ steps.prepare.outputs.public_dir }}
          SOURCE_REVISION: ${{ github.sha }}
          ACTION_RUN_ID: ${{ github.run_id }}
          ACTION_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PUBLIC_DIR" && -d "$PUBLIC_DIR" && ! -L "$PUBLIC_DIR" ]] || exit 0
          public="$PUBLIC_DIR"
          [[ -d "$public" && ! -L "$public" ]] || exit 0
          controller_exit=1
          if [[ "$RUN_OUTCOME" == 'success' ]]; then controller_exit=0; fi
          python3 -B qa/reliability/linux-service-slice-27/acceptance.py \
            --public-dir "$public" --controller-exit "$controller_exit" \
            --controller-step-outcome "$RUN_OUTCOME" --run-id "$RUN_ID" \
            --source-revision "$SOURCE_REVISION" --workflow-run-id "$ACTION_RUN_ID" \
            --workflow-run-attempt "$ACTION_RUN_ATTEMPT"
      - name: Require accepted evidence when the controller step succeeds
        if: always() && steps.run-component.outcome == 'success'
        env:
          PUBLIC_DIR: ${{ steps.prepare.outputs.public_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PUBLIC_DIR/ACCEPTANCE.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("status") != "ACCEPTED_COMPONENT_QA":
              raise SystemExit("controller step succeeded without accepted component evidence")
          PY
      - name: Upload sanitized public summaries, acceptance record, and prepare receipt
        if: always() && steps.finalize-result.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-node-slice-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.public_dir }}/RESULT.json
            ${{ steps.prepare.outputs.public_dir }}/NATIVE.json
            ${{ steps.prepare.outputs.public_dir }}/prepare-receipt.json
            ${{ steps.prepare.outputs.public_dir }}/ACCEPTANCE.json
          if-no-files-found: warn
          retention-days: 3
