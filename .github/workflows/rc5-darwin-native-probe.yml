name: RC5 Darwin credential policy probe
on:
  push:
    branches: ['codex/rc5-darwin-native-probe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  darwin:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run owned credential policy cases
        shell: bash
        run: |
          set -euo pipefail
          src=qa/darwin-asid/darwin-credential-policy-probe.c
          out="$RUNNER_TEMP/darwin-credential-policy-results"
          mkdir -p "$out"
          uname -a > "$out/uname.txt"
          sw_vers > "$out/sw-vers.txt"
          xcrun clang --version > "$out/clang-version.txt"
          shasum -a 256 "$src" > "$out/source.sha256"
          xcrun clang -std=c11 -Wall -Wextra -O2 "$src" -o "$out/policy-probe" -lsandbox 2> "$out/compile.stderr"
          shasum -a 256 "$out/policy-probe" > "$out/binary.sha256"
          set +e
          sudo "$out/policy-probe" > "$out/root.jsonl" 2> "$out/root.stderr"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$out/root.exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-credential-policy-probe
          path: ${{ runner.temp }}/darwin-credential-policy-results
          if-no-files-found: error
          retention-days: 90
