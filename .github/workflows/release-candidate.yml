name: Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      memory_battle_report:
        description: 'Repository-relative path to a sanitized, source-only Mem0/FastEmbed battle report'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run release gate with required memory evidence
        env:
          KNOWLEDGE_MEMORY_BATTLE_REPORT: ${{ inputs.memory_battle_report }}
        run: node tools/release-gate.js --mode release --no-fail-fast --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-${{ matrix.os }}
          path: |
            maintenance/release-gate-report.json
            maintenance/release-gate-report.md
            .qa-tmp/release-gate/logs/**
