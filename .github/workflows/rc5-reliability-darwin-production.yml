name: RC5 reliability Darwin production failures matrix

on:
  workflow_dispatch:
  push:
    branches: [codex/rc5-reliability-20261025]
    paths:
      - qa/reliability/source/**
      - qa/reliability/DARWIN_PRODUCTION_ASSET_PINS.json
      - qa/reliability/controllers/darwin-production-*
      - qa/reliability/controllers/test-darwin-production-*
      - qa/reliability/controllers/darwin-protected-*
      - qa/reliability/controllers/lock-publication-before-search.c
      - qa/reliability/controllers/test-darwin-install-parent.py
      - qa/reliability/controllers/verify-darwin-ci-assets.py
      - qa/reliability/reference/**
      - .github/workflows/rc5-reliability-darwin-production.yml

permissions:
  contents: read

concurrency:
  group: rc5-reliability-darwin-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normal:
    name: public KVE KVF ACK (${{ matrix.arch }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production controller and source pins
        shell: bash
        run: |
          python3 qa/reliability/controllers/verify-darwin-ci-assets.py --root . --inventory qa/reliability/DARWIN_PRODUCTION_ASSET_PINS.json
          python3 qa/reliability/controllers/test-darwin-production-summary.py
          python3 qa/reliability/controllers/test-darwin-production-failures.py
          node qa/reliability/controllers/test-darwin-production-request.js --source qa/reliability/source/.knowledge --controller qa/reliability/controllers/darwin-production-controller.js
      - name: Execute normal and failures public production cases
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/knowledge-production-private"
          chmod 0700 "$RUNNER_TEMP/knowledge-production-private"
          set +e
          python3 qa/reliability/controllers/darwin-production-lifecycle.py \
            --source qa/reliability/source/.knowledge \
            --reference qa/reliability/reference \
            --evidence "$RUNNER_TEMP/knowledge-production-private/normal" \
            --case-set failures \
            --expected-arch '${{ matrix.arch }}' \
            >"$RUNNER_TEMP/knowledge-production-private/controller.stdout" \
            2>"$RUNNER_TEMP/knowledge-production-private/controller.stderr"
          native_status=$?
          python3 qa/reliability/controllers/darwin-production-summary.py \
            --private "$RUNNER_TEMP/knowledge-production-private/normal" \
            --public "$RUNNER_TEMP/knowledge-production-public" \
            --source qa/reliability/source/.knowledge \
            --controller-status "$native_status" \
            --case-set failures \
            --expected-arch '${{ matrix.arch }}'
          summary_status=$?
          if [ "$summary_status" -ne 0 ]; then exit "$summary_status"; fi
          exit "$native_status"
      - name: Upload allowlisted production facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc5-reliability-darwin-production-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/knowledge-production-public/summary.json
            ${{ runner.temp }}/knowledge-production-public/stages.json
