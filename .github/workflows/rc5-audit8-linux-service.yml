name: RC5 audit8 native Linux service
on:
  push:
    branches: [codex/rc5-blocker-fixes-20261027]
    paths: [.github/workflows/rc5-audit8-linux-service.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc5-audit8-linux-service
  cancel-in-progress: false
jobs:
  physical:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - uses: actions/download-artifact@v4
        with:
          name: audit7-budget-fixtures-exact-zip
          path: native-input
          run-id: 40649827600
          github-token: ${{ github.token }}
      - name: Restore only source-checked native input pairs
        id: native_input
        run: |
          python3 qa/reliability/audit8/linux/stage_native_pairs.py --package native-input/public/knowledge-v3.4.4.zip --source source/.knowledge --output evidence/native-input.json
      - name: Validate new reader and client regressions
        id: reader
        continue-on-error: true
        run: |
          node source/.knowledge/tests/verification-linux-service-finalization.test.js > evidence/reader-tests.tap 2> evidence/reader-tests.stderr.txt
      - name: Validate authenticated client regression cases
        id: client
        continue-on-error: true
        run: |
          node source/.knowledge/tests/reliability-linux-service-client.test.js > evidence/client-tests.tap 2> evidence/client-tests.stderr.txt
      - name: Native framing seals and inherited sender boundary
        id: boundary
        continue-on-error: true
        run: |
          mkdir -p evidence
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -Wno-parentheses qa/reliability/audit8/linux/native_boundary_test.c source/.knowledge/tools/lib/verification-linux-uid-history.c -lcrypto -o "$RUNNER_TEMP/native-boundary-test"
          "$RUNNER_TEMP/native-boundary-test" > evidence/native-boundary.json 2> evidence/native-boundary.stderr.txt
          gcc -std=c11 -O2 -Wall -Wextra -Werror -static -no-pie qa/reliability/audit8/linux/pidfd_kill.c -o "$RUNNER_TEMP/pidfd-kill"
      - name: Prepare protected runtime as ordinary UID
        id: prepare
        run: |
          mkdir -p evidence
          python3 qa/reliability/audit8/linux/prepare_service.py --source source/.knowledge --out "$RUNNER_TEMP/native-service-prepared" --node "$(command -v node)" --service-lifetime-seconds 14400 > evidence/prepare.stdout.txt 2> evidence/prepare.stderr.txt
          cp "$RUNNER_TEMP/native-service-prepared/prepare.json" evidence/prepare.json
          cp "$RUNNER_TEMP/native-service-prepared/install-native.sh" evidence/install-native.sh
          cp "$RUNNER_TEMP/native-service-prepared/stage/runtime.manifest" evidence/runtime.manifest
      - name: Install fixed root native service
        id: install
        run: |
          sudo /bin/sh "$RUNNER_TEMP/native-service-prepared/install-native.sh" > evidence/install.stdout.txt 2> evidence/install.stderr.txt
      - name: Reject actual malformed and inherited socket senders
        id: protocol
        continue-on-error: true
        run: |
          python3 qa/reliability/audit8/linux/protocol_mutations.py --output evidence/protocol-mutations.json > evidence/protocol.stdout.txt 2> evidence/protocol.stderr.txt
      - name: Public KVE KVF ACK path and failure reuse
        id: public
        continue-on-error: true
        run: |
          node qa/reliability/audit8/linux/public_production.cjs --source source/.knowledge --output evidence/public-production.json --cohort-seconds 600 --include-controller-crash > evidence/public.stdout.txt 2> evidence/public.stderr.txt
      - name: Physical native production entry and faults
        id: physical
        continue-on-error: true
        run: |
          python3 qa/reliability/audit8/linux/physical_native.py --pidfd-helper "$RUNNER_TEMP/pidfd-kill" --output evidence/native-physical.json > evidence/native.stdout.txt 2> evidence/native.stderr.txt
      - name: Actual blocked I/O preserves the original cleanup boundary
        id: blocked_io
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 qa/reliability/audit8/linux/blocked_io.py --output evidence/blocked-io.json > evidence/blocked-io.stdout.txt 2> evidence/blocked-io.stderr.txt
      - name: Preserve service diagnostics and identities
        if: always()
        run: |
          sudo journalctl --no-pager -u knowledge-linux-native-v1.service > evidence/service-journal.txt 2>&1 || true
          sudo systemctl show knowledge-linux-native-v1.service > evidence/service-state.txt 2>&1 || true
          cp /var/lib/knowledge-linux-native-v1/installation.json evidence/installation.json || true
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform
          p=pathlib.Path('source/.knowledge')
          rows=[{'path':str(f.relative_to(p)),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.rglob('*')) if f.is_file()]
          pathlib.Path('evidence/SOURCE_PINS.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'arch':platform.machine(),'files':rows},indent=2)+'\n')
          PY
      - name: Require every independent evidence lane to pass
        if: always()
        env:
          LANE_OUTCOMES: '${{ toJSON(steps) }}'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          steps=json.loads(os.environ['LANE_OUTCOMES'])
          names=['native_input','reader','client','boundary','prepare','install','protocol','physical','public','blocked_io']
          outcomes={name:steps.get(name,{}).get('outcome','missing') for name in names}
          passed=all(value=='success' for value in outcomes.values())
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/LANE_OUTCOMES.json').write_text(json.dumps({'passed':passed,'outcomes':outcomes},indent=2)+'\n')
          print(json.dumps(outcomes))
          sys.exit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit8-native-linux-${{ matrix.arch }}
          path: evidence
          retention-days: 3
          if-no-files-found: error
