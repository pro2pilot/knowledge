name: Post Release Live Asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag, for example v3.2.7
        required: true

permissions:
  contents: read

jobs:
  live-asset:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-gate.js --mode post-release --tag "${{ inputs.tag }}" --no-fail-fast --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-release-live-asset-${{ matrix.os }}
          path: |
            maintenance/release-gate-report.json
            maintenance/release-gate-report.md
            .qa-tmp/release-gate/logs/**
            .qa-tmp/live-release/**
